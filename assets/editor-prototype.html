<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PBro 编辑器原型</title><style>body{margin:0;font:14px system-ui;color:#19324a}header{padding:16px 24px;background:#19324a;color:white}main{display:grid;grid-template-columns:220px 1fr 280px;gap:16px;padding:16px;background:#f5f7fa;min-height:90vh}.card{background:white;border-radius:10px;padding:16px;box-shadow:0 2px 8px #0001}button{padding:8px 12px;border:0;border-radius:6px;background:#2c7be5;color:#fff}input{width:70px}.bar{height:12px;background:#e8edf3;border-radius:8px;margin:8px 0}.fill{height:100%;background:#2c7be5;border-radius:8px}.trace{border-left:3px solid #2c7be5;padding-left:10px;margin:10px 0}.muted{color:#718096}@media(max-width:800px){main{grid-template-columns:1fr}}
</style><header><b>中鱼机制｜PBro 编辑器原型</b><span style="float:right">Draft · CFG-0.4.2</span></header><main><section class=card><h3>鱼种 / 模式</h3><p>▾ 鲈鱼</p><p>　● MAIN</p><p>　○ open_chase</p><p>　○ AVOID</p><p>　○ FALLBACK</p></section><section class=card><h3>MAIN 参数</h3><label>priority <input id=prio type=number step=.1 value=1></label><label>aBase <input id=abase type=number step=.05 value=.55></label><h4>Target 预览</h4><p>浅水草边 <b id=t1v></b></p><div class=bar><div id=t1b class=fill></div></div><p>深水阴影 <b id=t2v></b></p><div class=bar><div id=t2b class=fill></div></div><h4>P / A</h4><p id=metrics></p><button onclick="recalc()">回放 Golden Case</button></section><aside class=card><h3>Trace</h3><div id=trace></div></aside></main><script>function recalc(){const p=Number(prio.value),a=Number(abase.value),t1=Math.max(0,Math.min(1,.62+p*.2)),t2=Math.max(0,Math.min(1,.28+p*.06)),sel=(t1*a)/(t1+t2);t1v.textContent=t1.toFixed(2);t1b.style.width=t1*100+'%';t2v.textContent=t2.toFixed(2);t2b.style.width=t2*100+'%';metrics.textContent='P：'+t1.toFixed(2)+' / '+t2.toFixed(2)+'　A selection：'+sel.toFixed(2)+'　A dominant：'+a.toFixed(2);trace.innerHTML='<div class=trace>Gate <b>PASS</b><br><span class=muted>温度 22℃，溶氧 7.1</span></div><div class=trace>P <b>'+t1.toFixed(2)+'</b><br><span class=muted>priority '+p.toFixed(2)+' 已参与重算</span></div><div class=trace>A selection <b>'+sel.toFixed(2)+'</b><br><span class=muted>按模式存在度加权</span></div>}recalc()</script>
